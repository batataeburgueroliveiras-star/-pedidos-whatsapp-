:root[data-theme=dark]{--bg:#111513;--card:#1b211e;--tx:#ece7dc;--mut:#a2a89c;--pri:#0b1310;--ac:#e0a84a;--ok:#5fbf86;--bad:#f08577;--bd:#2f3a34;--tag:#2a332e;--on:#111;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:.2em 0}
header{background:var(--pri);color:#f4efe4;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .logo{font:700 20px Georgia,serif;flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.w{max-width:1120px;margin:0 auto;padding:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
button,a.b{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:var(--on);cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
a.b{background:var(--ok);color:#fff}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button:disabled,option:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--tag)}
.late{color:var(--bad);font-weight:700}
.cols{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
.col{min-width:250px;flex:1;background:var(--tag);border-radius:14px;padding:10px}
.ph{font-size:44px;text-align:center;background:var(--bg);border-radius:12px;padding:10px 0}
.kd{font-size:17px}
.sum{font-size:13px;color:var(--mut)}
.warn{background:var(--tag);border-left:4px solid var(--ac);padding:8px 10px;border-radius:8px;font-size:13px}
.step{display:flex;gap:8px;font-size:14px;padding:3px 0}
#mo{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}
#mo.on{display:flex}
#mo>div{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pri);color:#f4efe4;padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90%}
.bar{height:120px;display:flex;align-items:flex-end;gap:6px;margin:14px 0 24px}
.bar div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px;position:relative}
.bar span{position:absolute;bottom:-18px;left:-4px;right:-4px;text-align:center;font-size:11px;color:var(--mut)}
</style>
</head>

}

function totals(cart,cpn,mod,b){
  const sub=cart.reduce((t,x)=>t+unit(S.p.find(p=>p.id===x.pid),x.ad)*x.qty,0);
  const disc=cpn&&S.cp[cpn]?+(sub*S.cp[cpn]/100).toFixed(2):0;
  const fee=mod==='entrega'?(feeFor(b)||0):0;
  return {sub,disc,fee,tot:sub-disc+fee};
}
function place(c,mod,pay,cart,cpn,troco,ts,st,tk){

  const od={id:'#'+S.seq++,cod:genCode(),tk:tk||'',ts:d,c,mod,pay,troco:troco||'',it,...t,cpn:cpn&&S.cp[cpn]?cpn:'',st:s0,pagst:'pendente',hist:[[s0,d,'Sistema']],ocor:[],prio:0,motivo:''};
  S.o.unshift(od);return od;
}
function canMove(o,to){
  const k=o.st+'>'+to,ok=NEXT[k];
  if(!ok||!SES||!ok.includes(SES.r))return false;
  if(k==='pronto>rota'&&o.mod!=='entrega')return false;
  if(k==='pronto>concluido'&&o.mod!=='retirada')return false;
  return true;
}
function setSt(id,to){

/* ---------- acesso da equipe (demonstração) ---------- */
async function hash(p,s){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:100000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function initUsers(){
  try{let c=0;for(const u of S.u)if(!u.h){u.s=hex(16);u.h=await hash('demo123',u.s);c++}if(c)persist()}catch(e){}
}
async function doLogin(f){
  const d=Object.fromEntries(new FormData(f));
  const u=S.u.find(x=>x.user===(d.user||'').trim().toLowerCase()&&x.on);
  if(!u||!u.h)return toast('Usuário ou senha inválidos');
  let ok=false;
  try{ok=u.h===await hash(d.pass||'',u.s)}catch(e){return toast('Este navegador não consegue verificar senhas com segurança')}
  if(!ok)return toast('Usuário ou senha inválidos');
  SES={uid:u.id,n:u.n,r:u.r};sessionStorage.setItem(SKEY,JSON.stringify(SES));
  log('Login','');R=PERM[u.r][0];save();
}

/* Finalização: travada entre abas (Web Locks), relê o estado salvo, e reconhece o token de idempotência */
function finalize(f){
  if(V.sending)return;
  const d=Object.fromEntries(new FormData(f));
  V.sending=true;
  const run=()=>{try{commit(d)}finally{V.sending=false}};
  if(navigator.locks)navigator.locks.request('bistro-central-pedidos',run);else run();
}
function commit(d){
  reload();
  const dup=d.tk&&S.o.find(o=>o.tk===d.tk);
  if(dup){V.last=dup.id;V.view='ok';V.tk='';return render()}
  if(!(d.n||'').trim()||(d.p||'').replace(/\D/g,'').length<10)return toast('Informe nome e telefone válidos');
  if(!PAY_MOD[d.mod]||!PAY_MOD[d.mod].includes(d.pay))return toast('Forma de pagamento indisponível para esta modalidade');
  if(d.mod==='entrega'&&(!d.a||!d.num||!d.b))return toast('Preencha endereço, número e bairro para entrega');
  if(d.mod==='entrega'&&!bairroOk(d.b))return toast('Escolha um bairro atendido para a entrega');
  if(!S.s.open)return toast('O restaurante está fechado');
  if(!S.cart.length)return toast('Seu carrinho está vazio');
  const t=totals(S.cart,V.cpn,d.mod,d.b);
  if(t.sub-t.disc<S.s.min)return toast('Pedido abaixo do valor mínimo');
  const querTroco=d.pay==='dinheiro'&&d.trocosim==='sim';
  let troco='';
  if(querTroco){const v=+String(d.troco||'').replace(',','.');if(!(v>0))return toast('Informe para quanto será o troco');if(v<t.tot)return toast('O troco precisa ser igual ou maior que o total ('+money(t.tot)+')');troco=v}
  const c={n:d.n.trim(),p:d.p.trim(),a:d.a||'',num:d.num||'',comp:d.comp||'',b:d.b||'',ref:d.ref||'',obs:d.obs||''};
  const od=place(c,d.mod,d.pay,S.cart,V.cpn,troco,undefined,undefined,d.tk);
  log('Pedido recebido',od.id);
  S.cart=[];V.cpn='';V.view='ok';V.last=od.id;V.tk='';
  persist();remember(od.cod);render();
}
function pedidoTexto(od){
  const L=[`Pedido ${od.id} — ${S.s.name}`,`Código de acompanhamento: ${fmtCode(od.cod)}`,'','PRODUTOS'];
  od.it.forEach(i=>{L.push(`${i.q}x ${i.n} — ${money(i.u*i.q)}`);i.ad.forEach(a=>L.push(`   + ${a}`));if(i.obs)L.push(`   Obs.: ${i.obs}`)});
  L.push(`Valor dos produtos: ${money(od.sub)}`,'');
  if(od.mod==='entrega'){L.push('ENTREGA',`Bairro: ${od.c.b}`,`Taxa de entrega: ${money(od.fee)}`,'')}
  else{L.push('RETIRADA: no restaurante, sem taxa','')}
  L.push('RESUMO',`Subtotal: ${money(od.sub)}`);
  if(od.disc)L.push(`Desconto${od.cpn?' ('+od.cpn+')':''}: − ${money(od.disc)}`);
  L.push(`Entrega: ${money(od.fee)}`,`TOTAL: ${money(od.tot)}`,'');
  L.push('PAGAMENTO',`Forma de pagamento: ${PAY[od.pay]||od.pay}`);
  if(od.pay==='dinheiro'){L.push(`Precisa de troco? ${od.troco!==''?'Sim':'Não'}`);if(od.troco!==''){L.push(`Troco para: ${money(od.troco)}`,`Troco a devolver: ${money(od.troco-od.tot)}`)}}
  L.push('','CLIENTE',`Nome: ${od.c.n}`,`Telefone: ${od.c.p}`);
  L.push(od.mod==='entrega'?`Endereço: ${od.c.a}, ${od.c.num}${od.c.comp?' ('+od.c.comp+')':''} — ${od.c.b}${od.c.ref?' · Ref.: '+od.c.ref:''}`:'Retirada no restaurante');
  if(od.c.obs)L.push(`Observações: ${od.c.obs}`);
  return L.join('\n');
}

function vDash(){

  const os=S.o.filter(x=>x.ts>=from&&x.st!=='cancelado');
  const rec=os.filter(x=>x.pagst==='recebido').reduce((t,x)=>t+x.tot,0);
  const aRec=os.filter(x=>x.pagst!=='recebido').reduce((t,x)=>t+x.tot,0);
  const tm=os.length?os.reduce((t,x)=>t+x.tot,0)/os.length:0;
  const and=S.o.filter(x=>ATIVOS.includes(x.st)).length;
  const cnt={};os.forEach(x=>x.it.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+i.q));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bars=[];
  for(let i=N-1;i>=0;i--){const d0=new Date(Date.now()-i*864e5).setHours(0,0,0,0),d1=d0+864e5;
    bars.push([new Date(d0).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),S.o.filter(x=>x.ts>=d0&&x.ts<d1&&x.st!=='cancelado').reduce((t,x)=>t+x.tot,0)])}

  return `<div class="r" style="justify-content:flex-start;margin-bottom:12px">${[['hoje','Hoje'],['7d','7 dias'],['30d','30 dias']].map(([k,l])=>`<button class="${V.per===k?'':'s'}" data-a="per" data-v="${k}">${l}</button>`).join('')}</div>

async function addUser(f){
  const d=Object.fromEntries(new FormData(f)),user=(d.user||'').trim().toLowerCase();

  <label>Descrição</label><input name="desc" maxlength="160">
  <label>Adicionais (ex.: Bacon extra:4; Ovo:3)</label><input name="ad" maxlength="200">
  <button type="submit" style="margin-top:10px">Adicionar ao cardápio</button></form></div>
  <div>${S.p.map(p=>`<div class="c" style="margin-top:10px"><div class="r"><span>${esc(p.e)} <b>${esc(p.name)}</b> <span class="sum">${esc(p.cat)}</span></span><span class="tag">${p.av?'Disponível':'Indisponível'}</span></div>
  <div class="r" style="margin-top:8px;justify-content:flex-start;gap:12px"><label style="margin:0;width:130px">Preço<input type="number" step="0.5" value="${esc(p.price)}" data-pid="${esc(p.id)}" data-f="price"></label>
  <label style="margin:0;width:130px">Promoção %<input type="number" min="0" max="90" value="${esc(p.promo)}" data-pid="${esc(p.id)}" data-f="promo"></label>
  <button class="s" data-a="avail" data-id="${esc(p.id)}">${p.av?'Tornar indisponível':'Ativar'}</button><button class="bad" data-a="delp" data-id="${esc(p.id)}">Excluir</button></div></div>`).join('')}</div>`;
}
function addProd(f){
  const d=Object.fromEntries(new FormData(f));
  if(!d.name||!d.price)return toast('Informe nome e preço');
  S.p.push({id:'p'+Date.now(),cat:d.cat||'Outros',name:d.name.trim(),desc:d.desc||'',price:+String(d.price).replace(',','.')||0,promo:0,e:d.e||'🍽️',av:1,ad:parseKV(d.ad||'')});
  log('Produto cadastrado',d.name);save();toast('Produto adicionado');
}
function vCfg(){const s=S.s;return `<form id="cfg" class="c">
  <div class="r" style="gap:12px;align-items:flex-start"><div style="flex:1;min-width:200px"><label>Nome do restaurante</label><input name="name" value="${esc(s.name)}" maxlength="60"></div><div style="flex:1;min-width:200px"><label>Horário de funcionamento</label><input name="hours" value="${esc(s.hours)}" maxlength="80"></div></div>
  <div class="r" style="gap:12px"><div style="flex:1"><label>WhatsApp (código do país + DDD + número)</label><input name="wa" value="${esc(s.wa)}"></div><div style="flex:1"><label>Chave PIX</label><input name="pix" value="${esc(s.pix)}" maxlength="80"></div></div>
  <div class="r" style="gap:12px"><div style="flex:1"><label>Tempo de preparo (min)</label><input name="prep" type="number" value="${esc(s.prep)}"></div><div style="flex:1"><label>Pedido mínimo (R$)</label><input name="min" type="number" step="0.5" value="${esc(s.min)}"></div></div>
  <div class="sum" style="margin:6px 0">Taxas de entrega: cadastre na aba "Taxas de entrega".</div>
  <label>Cupons (ex.: BISTRO10:10)</label><input name="cp" value="${esc(Object.entries(S.cp).map(([k,v])=>k+':'+v).join('; '))}">
  <label>Aceitar pedidos</label><select name="open"><option value="1" ${s.open?'selected':''}>Sim, restaurante aberto</option><option value="0" ${s.open?'':'selected'}>Não, fechado</option></select>
  <div class="r" style="margin-top:14px"><button type="submit">Salvar configurações</button><button type="button" class="s" data-a="reset">Restaurar dados de demonstração</button></div></form>`}
function saveCfg(f){
  const d=Object.fromEntries(new FormData(f)),s=S.s;
  s.name=(d.name||s.name).trim();s.hours=d.hours||'';s.wa=(d.wa||'').replace(/\D/g,'');s.pix=d.pix||'';
  s.prep=+d.prep||s.prep;s.min=+d.min||0;
  s.open=d.open==='1'?1:0;
  S.cp=Object.fromEntries(parseKV(d.cp||'').map(([k,v])=>[k.toUpperCase(),v]));
  log('Configurações alteradas','');save();toast('Configurações salvas');
}
function vTaxas(){
  return `<div class="c"><b>Novo bairro atendido</b><form id="nb" style="margin-top:6px"><div class="r" style="gap:10px;align-items:flex-end"><div style="flex:2;min-width:180px"><label>Bairro</label><input name="nome" required maxlength="60"></div><div style="flex:1;min-width:120px"><label>Taxa (R$)</label><input name="taxa" inputmode="decimal" required></div><button type="submit">Adicionar</button></div></form></div>
  <div class="sum" style="margin:12px 0 4px">Desativar tira o bairro do checkout. Pedidos antigos mantêm a taxa registrada no momento da compra.</div>
  ${(S.bairros||[]).map(x=>`<div class="c" style="margin-top:8px"><div class="r"><b>${esc(x.nome)}</b><span class="tag">${x.ativo?'Ativo':'Desativado'}</span></div><div class="r" style="margin-top:8px;justify-content:flex-start;gap:10px"><label style="margin:0;width:150px">Taxa (R$)<input type="number" step="0.5" min="0" value="${esc(x.taxa)}" data-bid="${esc(x.id)}" data-bf="taxa"></label><label style="margin:0;flex:1;min-width:140px">Nome<input value="${esc(x.nome)}" maxlength="60" data-bid="${esc(x.id)}" data-bf="nome"></label><button class="s" data-a="btoggle" data-id="${esc(x.id)}">${x.ativo?'Desativar':'Ativar'}</button><button class="bad" data-a="bdel" data-id="${esc(x.id)}">Excluir</button></div></div>`).join('')||'<div class="sum">Nenhum bairro cadastrado. Sem bairro ativo, não é possível finalizar entregas.</div>'}`;
}
function addBairro(f){
  const d=Object.fromEntries(new FormData(f));
  const nome=(d.nome||'').trim(),taxa=+String(d.taxa||'').replace(',','.');
  if(!nome)return toast('Informe o nome do bairro');
  if(!(taxa>=0))return toast('Informe uma taxa válida');
  if((S.bairros||[]).some(x=>x.nome.toLowerCase()===nome.toLowerCase()))return toast('Este bairro já está cadastrado');
  S.bairros=(S.bairros||[]).concat([{id:'b'+Date.now(),nome,taxa,ativo:true}]);
  log('Bairro cadastrado',nome);save();toast('Bairro adicionado');
}
function vAud(){return `<div class="c">${S.log.slice(0,100).map(l=>`<div class="sum" style="padding:5px 0;border-bottom:1px solid var(--bd)">${new Date(l[0]).toLocaleString('pt-BR')} · <b>${esc(l[1])}</b> · ${esc(l[2])} ${esc(l[3])}</div>`).join('')||'<div class="sum">Nenhum registro.</div>'}</div>`}

/* ---------- EVENTOS ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('#mo'))return closeModal();
  const t=e.target.closest('[data-a]');if(!t)return;
  const d=t.dataset;
  switch(d.a){
    case 'go':R=d.r;V.view='menu';render();window.scrollTo(0,0);break;
    case 'logout':logout();break;
    case 'forgot':modal('<h3>Esqueci minha senha</h3><p class="sum">A recuperação automática por e-mail depende do Supabase Auth, ainda não configurado. Peça ao administrador para redefinir sua senha.</p>');break;
    case 'close':closeModal();break;
    case 'view':V.view=d.v;render();window.scrollTo(0,0);break;
    case 'trkgo':V.trk=($('#trk').value||'').trim();render();break;
    case 'cat':V.cat=d.v;render();break;
    case 'open':openProd(d.id);break;
    case 'q':V.qty=Math.max(1,V.qty+ +d.d);$('#qv').textContent=V.qty;updPv();break;
    case 'addcart':{const ad=checked(),obs=$('#obs').value.trim();S.cart.push({pid:V.pid,qty:V.qty,ad,obs});closeModal();save();toast('Adicionado ao carrinho');break}
    case 'cq':S.cart[+d.i].qty=Math.max(1,S.cart[+d.i].qty+ +d.d);save();break;
    case 'crm':S.cart.splice(+d.i,1);save();break;
    case 'cupom':{const v=($('#cp').value||'').trim().toUpperCase();if(v&&!S.cp[v]){V.cpn='';toast('Cupom inválido')}else{V.cpn=v;toast(v?'Cupom aplicado':'Cupom removido')}render();break}
    case 'st':setSt(d.id,d.to);break;
    case 'cancel':{const o=find(d.id);if(o&&canMove(o,'cancelado'))openCancel(d.id);else toast('Esta ação não está disponível para o seu perfil');break}
    case 'cancelok':{const m=$('#mot').value.trim();if(!m)return toast('Informe a justificativa');const o=find(d.id);if(!o||!canMove(o,'cancelado'))return toast('Esta ação não está disponível para o seu perfil');o.motivo=m;closeModal();setSt(d.id,'cancelado');break}
    case 'pagok':{if(!SES||!['admin','atend','entregador'].includes(SES.r))return toast('Sem permissão');const o=find(d.id);if(!o||o.st==='cancelado')break;o.pagst='recebido';log('Pagamento recebido',o.id);save();break}
    case 'prio':{if(!SES)return toast('Entre na área da equipe');const od=find(d.id);if(od){od.prio=od.prio?0:1;save()}break}
    case 'print':openComanda(d.id);break;
    case 'ocor':openOcor(d.id);break;
    case 'ocorok':{const txt=$('#oc').value.trim();if(!txt)return toast('Descreva a ocorrência');const o=find(d.id);if(o){o.ocor.push(txt);log('Ocorrência registrada',o.id)}closeModal();save();break}
    case 'sound':S.snd=S.snd?0:1;if(S.snd)beep();save();break;
    case 'adm':V.adm=d.v;render();break;
    case 'per':V.per=d.v;render();break;
    case 'uon':{const u=S.u.find(x=>x.id===d.id);if(!u||u.r==='admin')break;u.on=u.on?0:1;log((u.on?'Reativou':'Desativou')+' funcionário',u.user);save();break}
    case 'upass':modal(`<h3>Redefinir senha</h3><label>Nova senha (mín. 6)</label><input id="npw" type="password" minlength="6"><div class="r" style="margin-top:12px;justify-content:flex-end"><button data-a="upassok" data-id="${esc(d.id)}">Salvar</button></div>`);break;
    case 'upassok':{const pw=$('#npw').value;if(pw.length<6)return toast('A senha precisa de 6 caracteres');const u=S.u.find(x=>x.id===d.id);if(!u)break;const s=hex(16);hash(pw,s).then(h=>{u.s=s;u.h=h;log('Senha redefinida',u.user);closeModal();save();toast('Senha redefinida')}).catch(()=>toast('Este navegador não consegue cadastrar senhas com segurança'));break}
    case 'avail':{const p=S.p.find(x=>x.id===d.id);if(p){p.av=p.av?0:1;log('Produto '+(p.av?'ativado':'desativado'),p.name);save()}break}
    case 'delp':modal(`<h3>Excluir produto?</h3><p class="sum">O produto sai do cardápio e do carrinho. Pedidos anteriores são mantidos.</p><div class="r" style="justify-content:flex-end"><button class="bad" data-a="delok" data-id="${esc(d.id)}">Excluir</button></div>`);break;
    case 'delok':{const p=S.p.find(x=>x.id===d.id);S.p=S.p.filter(x=>x.id!==d.id);S.cart=S.cart.filter(x=>x.pid!==d.id);log('Produto excluído',p?p.name:'');closeModal();save();break}
    case 'reset':modal('<h3>Restaurar dados de demonstração?</h3><p class="sum">Pedidos, cardápio, funcionários e configurações voltam ao estado inicial.</p><div class="r" style="justify-content:flex-end"><button class="bad" data-a="resetok">Restaurar</button></div>');break;
    case 'btoggle':{const b=(S.bairros||[]).find(x=>x.id===d.id);if(b){b.ativo=!b.ativo;log((b.ativo?'Ativou':'Desativou')+' bairro',b.nome);save()}break}
    case 'bdel':modal(`<h3>Excluir bairro?</h3><p class="sum">Pedidos antigos continuam com a taxa registrada no momento da compra.</p><div class="r" style="justify-content:flex-end"><button class="bad" data-a="bdelok" data-id="${esc(d.id)}">Excluir</button></div>`);break;
    case 'bdelok':{const b=(S.bairros||[]).find(x=>x.id===d.id);S.bairros=(S.bairros||[]).filter(x=>x.id!==d.id);log('Bairro excluído',b?b.nome:'');closeModal();save();break}
    case 'resetok':seed();SES=null;sessionStorage.removeItem(SKEY);R='cliente';V.view='menu';closeModal();initUsers();save();toast('Dados restaurados');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){V.q=t.value;$('#grid').innerHTML=grid()}
  else if(t.id==='bq'){V.bq=t.value;$('#board').innerHTML=boardAtend()}
  else if(t.name==='b')updTot();
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(t.name==='mod'){V.mod=t.value;V.pay=PAY_MOD[V.mod][0];$('#addr').style.display=V.mod==='entrega'?'block':'none';$('#pay').innerHTML=payOptions();paySwitch();updTot()}
  else if(t.name==='pay'){V.pay=t.value;paySwitch()}
  else if(t.name==='ad')updPv();
  else if(t.name==='trocosim'){$('#trocoval').style.display=t.value==='sim'?'block':'none'}
  else if(t.name==='b')updTot();
  else if(d.bf){const b=(S.bairros||[]).find(x=>x.id===d.bid);if(b){if(d.bf==='taxa'){const v=+String(t.value).replace(',','.');if(!(v>=0)){toast('Taxa inválida');return render()}b.taxa=v}else{const n=(t.value||'').trim();if(!n){toast('Informe o nome do bairro');return render()}b.nome=n}log('Bairro alterado',b.nome);save()}}
  else if(d.f){const p=S.p.find(x=>x.id===d.pid);if(p){p[d.f]=+String(t.value).replace(',','.')||0;log('Produto alterado',p.name);save()}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='ck')finalize(f);
  else if(f.id==='np')addProd(f);
  else if(f.id==='cfg')saveCfg(f);
  else if(f.id==='login')doLogin(f);
  else if(f.id==='nf')addUser(f);
  else if(f.id==='nb')addBairro(f);
});
window.addEventListener('storage',e=>{if(e.key===KEY){load();loadSes();render()}});
setInterval(()=>{const b=$('#board');if(!b)return;
  b.innerHTML=R==='atend'?boardAtend():R==='cozinha'?boardCoz():R==='entregador'?boardEnt():b.innerHTML},20000);

load();loadSes();render();initUsers();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});}</script>
</body>
</html>
